{%- comment -%} 별점 (1~5). include.rating 으로 숫자를 넘깁니다. {%- endcomment -%}
{%- assign r = include.rating | plus: 0 -%}
<span class="stars" title="{{ r }}점 / 5점"><span class="sr-only">5점 만점에 {{ r }}점</span><span aria-hidden="true">
  {%- for i in (1..5) -%}{%- if i <= r -%}★{%- else -%}☆{%- endif -%}{%- endfor -%}
</span></span>
