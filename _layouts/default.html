<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/d2coding.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    // 저장해 둔 나이트 모드 설정을 화면이 그려지기 전에 적용
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  {% if site.author.avatar %}<link rel="icon" href="{{ site.author.avatar | relative_url }}">{% endif %}
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <!-- 작은 화면에서만 보이는 상단 줄 -->
  <div class="mobile-bar">
    <a class="site-title" href="{{ '/' | relative_url }}">
      {%- if site.author.avatar -%}<img class="avatar{% if site.author.avatar_pixel %} pixel{% endif %}" src="{{ site.author.avatar | relative_url }}" alt="" width="28" height="28">{%- endif -%}
      <span>{{ site.title }}</span>
    </a>
    <div class="mobile-actions">
      <button type="button" class="theme-btn" aria-label="나이트 모드"><svg class="theme-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button type="button" class="menu-btn" aria-expanded="false" aria-controls="sidebar">카테고리</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      {% include sidebar.html %}
    </aside>

    <main class="main">
      {{ content }}

      <footer class="site-footer">
        &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. Jekyll로 만들고 GitHub Pages에 올렸습니다.
      </footer>
    </main>
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
